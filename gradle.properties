# Sized for a 16GB laptop that is also running an IDE. A 4g heap here plus a separate
# Kotlin daemon plus an emulator will drive this machine into swap.
# CI runners have more headroom and raise these via GRADLE_OPTS in the workflow.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# NOTE: org.gradle.java.home is deliberately NOT set here.
#
# This file is committed, so pinning an absolute JDK path would hardcode one machine's
# home directory into everyone's build — CI has no /home/administrator, and it would fail
# before running a single task. Pass the JDK via the environment instead:
#
#   JAVA_HOME=~/.local/opt/jdk17 ./gradlew assembleDebug
#
# To make that permanent locally, put it in gradle.properties.local or your shell profile
# rather than here.
